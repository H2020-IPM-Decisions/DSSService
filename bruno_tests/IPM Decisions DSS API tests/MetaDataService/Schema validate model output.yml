info:
  name: Schema validate model output
  type: http
  seq: 6

http:
  method: POST
  url: "{{dss_url}}/rest/schema/modeloutput/validate"
  body:
    type: json
    data: |-
      {
          "timeStart": "2020-04-30T22:00:00Z",
          "timeEnd": "2020-05-02T22:00:00Z",
          "interval": 86400,
          "resultParameters": [
              "TMDD5C",
              "THRESHOLD_1",
              "THRESHOLD_2",
              "TMD5C",
              "TMD",
              "THRESHOLD_3"
          ],
          "locationResult": [
              {
                  "longitude": null,
                  "latitude": null,
                  "altitude": null,
                  "data": [
                      [
                          0.7,
                          260.0,
                          360.0,
                          0.7,
                          5.7,
                          560.0
                      ],
                      [
                          3.9,
                          260.0,
                          360.0,
                          3.2,
                          8.2,
                          560.0
                      ],
                      [
                          7.4,
                          260.0,
                          360.0,
                          3.5,
                          8.5,
                          560.0
                      ]
                  ],
                  "warningStatus": [
                      2,
                      2,
                      4
                  ],
                  "length": 3,
                  "width": 6
              }
          ]
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Status code is 200", function () {
            expect(res.getStatus()).to.equal(200);
        });

        test("The data has been validated",function(){
            var jsonData = res.getBody();
            expect(jsonData["isValid"]).to.eql(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
