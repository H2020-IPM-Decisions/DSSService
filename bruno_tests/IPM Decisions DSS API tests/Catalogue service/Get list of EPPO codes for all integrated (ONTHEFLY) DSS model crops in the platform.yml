info:
  name: Get list of EPPO codes for all integrated (ONTHEFLY) DSS model crops in the platform
  type: http
  seq: 24

http:
  method: GET
  url: "{{dss_url}}/rest/crop/execution_type/ONTHEFLY"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Status code is 200", function () {
            expect(res.getStatus()).to.equal(200);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
