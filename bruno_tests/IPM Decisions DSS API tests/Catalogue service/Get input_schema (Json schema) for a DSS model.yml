info:
  name: Get input_schema (Json schema) for a DSS model
  type: http
  seq: 13

http:
  method: GET
  url: "{{dss_url}}/rest/model/no.nibio.vips/PSILARTEMP/input_schema"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Status code is 200", function () {
            expect(res.getStatus()).to.equal(200);
        });
        test("Response is Json, and we find the data type of the modelId", function () {
            var jsonData = res.getBody();
            expect(jsonData.properties.modelId.type).to.eql("string");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
