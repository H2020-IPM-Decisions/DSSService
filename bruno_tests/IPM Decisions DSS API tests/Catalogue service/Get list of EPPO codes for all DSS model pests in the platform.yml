info:
  name: Get list of EPPO codes for all DSS model pests in the platform
  type: http
  seq: 22

http:
  method: GET
  url: "{{dss_url}}/rest/pest"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Status code is 200", function () {
            expect(res.getStatus()).to.equal(200);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
