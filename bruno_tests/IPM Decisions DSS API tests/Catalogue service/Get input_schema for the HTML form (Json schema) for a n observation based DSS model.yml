info:
  name: Get input_schema for the HTML form (Json schema) for a n observation based DSS model
  type: http
  seq: 17

http:
  method: GET
  url: "{{dss_url}}/rest/model/no.nibio.vips/PSILAROBSE/input_schema/ui_form"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Status code is 200", function () {
            expect(res.getStatus()).to.equal(200);
        });
        test("Response is Json, and we find the data type of the timeZone", function () {
            var jsonData = res.getBody();
            expect(jsonData.properties.configParameters.properties.timeZone.type).to.eql("string");
        });
        test("Response is Json, and the weatherData property should not be present. ", function () {
            var jsonData = res.getBody();
            expect(jsonData.properties.weatherData).to.be.undefined;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
