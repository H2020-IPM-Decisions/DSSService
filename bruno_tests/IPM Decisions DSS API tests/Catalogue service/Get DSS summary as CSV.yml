info:
  name: Get DSS summary as CSV
  type: http
  seq: 30

http:
  method: GET
  url: "{{dss_url}}/rest/dss/summary/csv?language=en"
  params:
    - name: language
      value: en
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
