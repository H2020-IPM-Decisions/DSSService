info:
  name: Get list of DSSs with all models that are links
  type: http
  seq: 2

http:
  method: GET
  url: "{{dss_url}}/rest/dss?executionType=LINK"
  params:
    - name: executionType
      value: LINK
      type: query
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Status code is 200", function () {
            expect(res.getStatus()).to.equal(200);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
