info:
  name: Get one DSS as Json
  type: http
  seq: 9

http:
  method: GET
  url: "{{dss_url}}/rest/dss/adas.dss?language=de"
  params:
    - name: language
      value: de
      type: query
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Status code is 200", function () {
            expect(res.getStatus()).to.equal(200);
        });
        test("Response is Json, and the correct id is present", function () {
            var jsonData = res.getBody();
            expect(jsonData.id).to.eql("adas.dss");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
