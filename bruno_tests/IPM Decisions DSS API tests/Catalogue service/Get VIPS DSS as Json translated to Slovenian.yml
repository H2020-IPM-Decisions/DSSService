info:
  name: Get VIPS DSS as Json translated to Slovenian
  type: http
  seq: 11

http:
  method: GET
  url: "{{dss_url}}/rest/dss/no.nibio.vips?language=sl"
  params:
    - name: language
      value: sl
      type: query
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Status code is 200", function () {
            expect(res.getStatus()).to.equal(200);
        });
        test("Response is Json, and the correct id is present", function () {
            var jsonData = res.getBody();
            expect(jsonData.id).to.eql("no.nibio.vips");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
