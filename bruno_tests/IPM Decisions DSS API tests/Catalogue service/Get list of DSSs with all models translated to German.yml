info:
  name: Get list of DSSs with all models translated to German
  type: http
  seq: 6

http:
  method: GET
  url: "{{dss_url}}/rest/dss?language=de"
  params:
    - name: language
      value: de
      type: query
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Status code is 200", function () {
            expect(res.getStatus()).to.equal(200);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
