info:
  name: Get one DSS as YAML
  type: http
  seq: 18

http:
  method: GET
  url: "{{dss_url}}/rest/dss/dk.seges/yaml"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Status code is 200", function () {
            expect(res.getStatus()).to.equal(200);
        });

        test("Body contains the correct ID", function () {
            expect(JSON.stringify(res.getBody())).to.include("dk.seges");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
