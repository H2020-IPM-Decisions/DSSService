info:
  name: Get list of DSSs with all models for a location (POINT) that are links
  type: http
  seq: 3

http:
  method: GET
  url: "{{dss_url}}/rest/dss/location/point?executionType=LINK&latitude=59.660468&longitude=10.781989"
  params:
    - name: executionType
      value: LINK
      type: query
    - name: latitude
      value: "59.660468"
      type: query
    - name: longitude
      value: "10.781989"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Status code is 200", function () {
            expect(res.getStatus()).to.equal(200);
        });

        test("IPMWise is returned", function () {
            var jsonData = res.getBody();
            expect(jsonData[0].models[0].id).to.eql("ipmwiseNO");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
